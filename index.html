<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Application</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link href="https://fonts.googleapis.com/css?family=Poppins:600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a81368914c.js"></script>
</head>
<body>
  <img class="wave" src="img/wave.png" alt="Wave background">
  <div class="container">
    <div class="img">
      <img src="img/bg.svg" alt="Background Image">
    </div>
    <div class="login-content">
      <form action="appform/home.html" method="get"> <!-- Link to your application form here -->
        <img src="img/avatar.svg" alt="Avatar">
        <h2 class="title">Welcome</h2>
        <input type="button" class="btn" value="Start Application" id="startBtn">
      </form>
    </div>
  </div>

  <script type="text/javascript" src="js/main.js">
    document.getElementById('startBtn').addEventListener('click', function () {
    document.body.classList.add('fade-out');
    setTimeout(function () {
      window.location.href = "home.html";
    }, 700); // Match the CSS transition time
  });
  </script>
</body>
</html>
